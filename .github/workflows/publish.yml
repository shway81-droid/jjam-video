name: 발행 — jjam-classroom 에서 받아 배포

# 이 사이트의 소스는 shway81-droid/jjam-classroom 의 `video/` 폴더다.
# 이 저장소의 main 은 합치기 전 기록으로 얼어 있고, 발행되는 내용이 아니다.
# 주소(github.io/jjam-video/)가 저장소 이름에서 나오기 때문에 발행만 여기 남겨 두었다.
#
# 언제 도는가
#   - 하루 한 번(KST 04시경) — 상류가 그대로면 몇 초 만에 건너뛴다
#   - 즉시 반영하려면 Actions 탭에서 "Run workflow"

on:
  # 이 워크플로 자체가 바뀌면(=머지되면) 바로 한 번 발행한다
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  schedule:
    # 하루 한 번이면 충분한 안전망이다. 처음엔 매시간이었는데, 다섯 저장소가
    # 하루 120번 헛돌면서 무료 러너 큐를 스스로 막았다 — 실행이 몇 시간씩
    # 대기하다 다음 실행에 밀려 취소되고, 그게 "Run failed" 메일로 왔다.
    # 발행할 게 실제로 있는 건 어쩌다 한 번이다. 즉시 반영은 Run workflow.
    # 분을 저장소마다 10분씩 어긋냈다 (UTC 19:20 = KST 04:20).
    - cron: '20 19 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [classroom-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 상류(jjam-classroom) 받기
        uses: actions/checkout@v4
        with:
          repository: shway81-droid/jjam-classroom
          ref: main
          path: src

      - name: 사이트 폴더를 꺼내고 서비스워커 캐시 이름을 상류 커밋으로 갱신
        id: build
        run: |
          SHA=$(git -C src rev-parse --short HEAD)
          rm -rf site && mkdir site
          cp -a src/video/. site/
          touch site/.nojekyll
          sed -i "s|const CACHE_NAME = '[^']*';|const CACHE_NAME = 'jjamvideo-${SHA}';|" site/sw.js
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "상류 $SHA 로 빌드함"

      - name: 이미 같은 것이 올라가 있으면 건너뛴다
        id: gate
        run: |
          LIVE=$(curl -sf --max-time 20 https://shway81-droid.github.io/jjam-video/sw.js || true)
          if printf '%s' "$LIVE" | grep -qF "${{ steps.build.outputs.sha }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "이미 상류 ${{ steps.build.outputs.sha }} 가 올라가 있다 — 건너뛴다"
          fi

      - name: Configure Pages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        if: steps.gate.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
